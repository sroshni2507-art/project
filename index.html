<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VastraVerse · SmartWeave XR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050810;
    color: white;
}

/* UI Panel */
#uiPanel {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 260px;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border: 1px solid #c9a84c;
    z-index: 999;
}

h2 {
    font-size: 16px;
    margin-bottom: 10px;
    color: #c9a84c;
}

button {
    width: 100%;
    margin: 5px 0;
    padding: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.fabricBtn {
    background: #222;
    color: white;
    border: 1px solid #c9a84c;
}

#rotateBtn {
    background: #c9a84c;
}

#tempSlider {
    width: 100%;
}
</style>
</head>

<body>

<!-- UI PANEL -->
<div id="uiPanel">
    <h2>VastraVerse XR</h2>

    <b>Fabric Collection</b>
    <button class="fabricBtn" onclick="changeFabric('#c06030')">Kanchipuram Silk</button>
    <button class="fabricBtn" onclick="changeFabric('#2050c0')">Cool Banarasi</button>
    <button class="fabricBtn" onclick="changeFabric('#50b050')">Organic Khadi</button>
    <button class="fabricBtn" onclick="changeFabric('#c030c0')">Smart Chanderi</button>

    <hr>

    <b>Temperature</b>
    <input type="range" id="tempSlider" min="15" max="50" value="30" oninput="updateTemp(this.value)">
    <div id="tempValue">30°C</div>

    <hr>

    <button id="rotateBtn" onclick="toggleRotation()">Toggle Rotation</button>
</div>

<!-- A-FRAME SCENE -->
<a-scene
    embedded
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
>

    <!-- Assets -->
    <a-assets>
        <a-asset-item id="modelAsset"
            src="https://cdn.aframe.io/test-models/models/glTF/DamagedHelmet/glTF/DamagedHelmet.gltf">
        </a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-entity camera look-controls position="0 1.6 3"></a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="2 4 2"></a-entity>

    <!-- AR Marker -->
    <a-marker preset="hiro">
        <a-entity id="arModel"
            gltf-model="#modelAsset"
            position="0 0 0"
            scale="0.5 0.5 0.5">
        </a-entity>
    </a-marker>

    <!-- VR / Desktop Model -->
    <a-entity id="vrModel"
        gltf-model="#modelAsset"
        position="0 1 -3"
        scale="0.5 0.5 0.5">
    </a-entity>

</a-scene>

<script>

let isRotating = false;
let rotationInterval = null;

/* FABRIC CHANGE */
function changeFabric(colorHex) {

    const models = [
        document.querySelector('#arModel'),
        document.querySelector('#vrModel')
    ];

    models.forEach(entity => {

        entity.addEventListener('model-loaded', () => {
            const mesh = entity.getObject3D('mesh');
            mesh.traverse(node => {
                if (node.isMesh) {
                    node.material.color.set(colorHex);
                }
            });
        });

        // If already loaded
        const mesh = entity.getObject3D('mesh');
        if (mesh) {
            mesh.traverse(node => {
                if (node.isMesh) {
                    node.material.color.set(colorHex);
                }
            });
        }

    });
}

/* TEMPERATURE REACTION */
function updateTemp(value) {

    document.getElementById('tempValue').innerText = value + "°C";

    const models = [
        document.querySelector('#arModel'),
        document.querySelector('#vrModel')
    ];

    models.forEach(entity => {
        const mesh = entity.getObject3D('mesh');
        if (!mesh) return;

        mesh.traverse(node => {
            if (node.isMesh) {
                if (value > 30) {
                    node.material.emissive.set('#00ccff'); // cooling glow
                } else if (value < 20) {
                    node.material.emissive.set('#ff5500'); // heating glow
                } else {
                    node.material.emissive.set('#000000'); // neutral
                }
            }
        });
    });
}

/* ROTATION */
function toggleRotation() {

    const vrModel = document.querySelector('#vrModel');

    isRotating = !isRotating;

    if (isRotating) {
        rotationInterval = setInterval(() => {
            let rot = vrModel.getAttribute('rotation');
            vrModel.setAttribute('rotation', {
                x: rot.x,
                y: rot.y + 1,
                z: rot.z
            });
        }, 16);
    } else {
        clearInterval(rotationInterval);
    }
}

</script>

</body>
</html>
