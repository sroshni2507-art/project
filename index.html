<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VastraVerse SmartWeave XR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f1a;
  color:white;
}

/* UI Panel */
#ui {
  position:fixed;
  top:20px;
  left:20px;
  background:rgba(0,0,0,0.7);
  padding:15px;
  border:1px solid #00ffe7;
  z-index:10;
}

button {
  margin:5px 0;
  padding:6px 10px;
  cursor:pointer;
  width:100%;
}

input {
  width:100%;
}
</style>
</head>

<body>

<!-- CONTROL PANEL -->
<div id="ui">
  <h3>SmartWeave Controls</h3>

  <b>Fabric</b><br>
  <button onclick="changeFabric('#c06030')">Kanchipuram Silk</button>
  <button onclick="changeFabric('#2050c0')">Cool Banarasi</button>
  <button onclick="changeFabric('#50b050')">Organic Khadi</button>
  <button onclick="changeFabric('#c030c0')">Smart Chanderi</button>

  <hr>

  <b>Temperature</b><br>
  <input type="range" min="15" max="50" value="30"
         oninput="updateTemp(this.value)">
  <div id="tempValue">30°C</div>

  <hr>

  <button onclick="toggleRotate()">Toggle Rotation</button>
</div>

<!-- A-FRAME SCENE -->
<a-scene background="color: #111">

  <!-- Camera -->
  <a-entity camera position="0 1.6 3"></a-entity>

  <!-- Lights -->
  <a-entity light="type: ambient; intensity: 0.8"></a-entity>
  <a-entity light="type: directional; intensity: 1" position="2 4 2"></a-entity>

  <!-- 3D MODEL -->
  <a-gltf-model id="mannequin"
      src="./vastraverse_mannequin.glb"
      position="0 0 -2"
      rotation="0 180 0"
      scale="0.5 0.5 0.5">
  </a-gltf-model>

</a-scene>

<script>

// Rotation state
let rotating = false;

// Change Fabric Color
function changeFabric(color){

  const model = document.querySelector('#mannequin');
  const mesh = model.getObject3D('mesh');

  if(!mesh){
    model.addEventListener('model-loaded', function(){
      applyColor(model, color);
    });
  } else {
    applyColor(model, color);
  }
}

function applyColor(model, color){
  const mesh = model.getObject3D('mesh');
  mesh.traverse(node => {
    if(node.isMesh){
      node.material.map = null;   // remove texture (important)
      node.material.color.set(color);
      node.material.needsUpdate = true;
    }
  });
}

// Temperature Effect
function updateTemp(val){
  document.getElementById("tempValue").innerText = val + "°C";

  const model = document.querySelector('#mannequin');
  const mesh = model.getObject3D('mesh');
  if(!mesh) return;

  mesh.traverse(node => {
    if(node.isMesh){
      if(val > 30){
        node.material.emissive.set('#00ccff');
      }
      else if(val < 20){
        node.material.emissive.set('#ff5500');
      }
      else{
        node.material.emissive.set('#000000');
      }
    }
  });
}

// Toggle Rotation
function toggleRotate(){
  rotating = !rotating;
}

// Auto rotate component
AFRAME.registerComponent('auto-rotate',{
  tick:function(){
    if(rotating){
      this.el.object3D.rotation.y += 0.01;
    }
  }
});

document.querySelector('#mannequin')
        .setAttribute('auto-rotate','');

</script>

</body>
</html>
