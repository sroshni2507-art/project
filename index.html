<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VastraVerse · Markerless Smart-AR</title>

  <!-- Stable A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Local aframe-ar (Ensure this path is correct) -->
  <script src="./aframe-ar-main/dist/aframe-ar.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&family=Space+Mono&display=swap');

    :root {
      --gold: #c9a84c;
      --cyan: #00ffe7;
      --magenta: #ff2d78;
      --bg: rgba(5, 8, 16, 0.85);
      --border: rgba(201, 168, 76, 0.3);
    }

    body { margin: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: #000; }

    /* ── UI HUD LAYER ── */
    #hud-overlay {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none; /* Allows interacting with 3D through UI */
      display: flex; flex-direction: column; justify-content: space-between;
    }
    #hud-overlay > * { pointer-events: all; }

    /* Panels */
    .header {
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
    }
    .side-panels { display: flex; justify-content: space-between; padding: 20px; flex-grow: 1; }
    
    .panel {
      width: 260px; background: var(--bg); border: 1px solid var(--border);
      padding: 15px; backdrop-filter: blur(8px); height: fit-content;
    }

    /* Typography */
    .logo { font-family: 'Orbitron'; color: var(--gold); letter-spacing: 3px; font-size: 16px; }
    .label { font-family: 'Space Mono'; font-size: 8px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; display: block; }
    .temp-val { font-family: 'Orbitron'; font-size: 35px; font-weight: 900; color: #fff; }

    /* Fabric Buttons */
    .fabric-btn {
      padding: 8px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s;
      font-size: 14px; color: #d0ddf5;
    }
    .fabric-btn.active { border-color: var(--gold); background: rgba(201,168,76,0.15); color: #fff; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }

    /* Slider */
    input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; }

    /* Footer */
    .footer {
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 15px; text-align: center; font-family: 'Space Mono';
      color: var(--cyan); font-size: 10px; letter-spacing: 2px;
    }

    /* Scanner Scanline Effect */
    .scanline {
      position: absolute; width: 100%; height: 2px; background: var(--cyan);
      opacity: 0.2; top: 0; animation: scan 4s linear infinite; pointer-events: none;
    }
    @keyframes scan { from { top: 0%; } to { top: 100%; } }
  </style>
</head>
<body>

  <!-- UI OVERLAY -->
  <div id="hud-overlay">
    <div class="header">
      <div class="logo">VASTRAVERSE<span> · XR</span></div>
      <div id="system-status" style="color: var(--cyan); font-family: 'Space Mono'; font-size: 9px;">SCANNING SURFACE...</div>
    </div>

    <div class="side-panels">
      <!-- Thermal Control -->
      <div class="panel" style="border-top: 3px solid var(--cyan);">
        <span class="label">Nano-Thermal Sensor</span>
        <div class="temp-val" id="temp-display">44<sup>°C</sup></div>
        <input type="range" id="temp-slider" min="15" max="50" value="44">
        <div style="margin-top:12px; font-family:'Space Mono'; font-size:10px; color: var(--cyan);">
          STATUS: <span id="mode-text">COOLING ACTIVE</span>
        </div>
      </div>

      <!-- Fabric Selector -->
      <div class="panel">
        <span class="label">Smart Collection</span>
        <div class="fabric-btn active" onclick="changeFabric('#c06030', 'Kanchipuram Silk')">
          <div class="dot" style="background: #c06030;"></div> Kanchipuram Silk
        </div>
        <div class="fabric-btn" onclick="changeFabric('#2050c0', 'Cool Banarasi')">
          <div class="dot" style="background: #2050c0;"></div> Cool Banarasi
        </div>
        <div class="fabric-btn" onclick="changeFabric('#50b050', 'Organic Khadi')">
          <div class="dot" style="background: #50b050;"></div> Organic Khadi
        </div>
      </div>
    </div>

    <div class="footer">
      TAP THE SURFACE TO PLACE 3D MODEL
    </div>
  </div>

  <div class="scanline"></div>

  <!-- A-FRAME / AR SCRIPT -->
  <script>
    // System Status Update
    function updateHUD(msg) {
      document.querySelector("#system-status").innerText = msg.toUpperCase();
    }

    // AR Placement Logic
    AFRAME.registerComponent('ar-logic', {
      init: function() {
        updateHUD('AR System Ready');
      },
      tick: function() {
        let cam = document.querySelector("#cam");
        if (!cam || !cam.components.raycaster) return;

        // Find intersection with the world
        let intersections = cam.components.raycaster.getIntersections(this.el);
        if (intersections.length > 0) {
          let hitPoint = intersections[0].point;
          let circle = document.querySelector("#circle");
          circle.setAttribute('position', hitPoint);
          circle.setAttribute('visible', 'true');
        }
      }
    });

    // Touch to Place function
    window.addEventListener('touchstart', function() {
      let circle = document.querySelector("#circle");
      let model = document.querySelector("#mannequin");
      let pos = circle.getAttribute('position');

      if (pos) {
        model.setAttribute('position', pos);
        model.setAttribute('visible', 'true');
        updateHUD('Mannequin Placed');
      }
    });

    // Fabric Color Function (Injection into GLB)
    function changeFabric(hexColor, name) {
      const modelEntity = document.querySelector("#mannequin");
      
      // Update UI
      document.querySelectorAll('.fabric-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      updateHUD('Applied: ' + name);

      // Change GLB Mesh Colors
      const mesh = modelEntity.getObject3D('mesh');
      if (mesh) {
        mesh.traverse(function(node) {
          if (node.isMesh) {
            // Create a new material or update existing one
            node.material.color.set(hexColor);
          }
        });
      }
    }

    // Temperature Slider Logic
    window.addEventListener('DOMContentLoaded', () => {
      const slider = document.querySelector('#temp-slider');
      const display = document.querySelector('#temp-display');
      const modeText = document.querySelector('#mode-text');
      const thermalLight = document.querySelector('#thermal-light');

      slider.addEventListener('input', (e) => {
        const val = e.target.value;
        display.innerHTML = `${val}<sup>°C</sup>`;

        if (val > 30) {
          modeText.innerText = "COOLING ACTIVE";
          modeText.style.color = "var(--cyan)";
          thermalLight.setAttribute('light', {color: '#00ffe7', intensity: (val - 30) / 10});
        } else if (val < 22) {
          modeText.innerText = "HEATING ACTIVE";
          modeText.style.color = "var(--magenta)";
          thermalLight.setAttribute('light', {color: '#ff2d78', intensity: (22 - val) / 10});
        } else {
          modeText.innerText = "STABLE";
          modeText.style.color = "#fff";
          thermalLight.setAttribute('light', 'intensity', 0);
        }
      });
    });
  </script>

  <!-- A-FRAME SCENE -->
  <a-scene ar ar-logic renderer="antialias: true; alpha: true;">
    
    <!-- Camera with Raycaster for surface detection -->
    <a-camera id="cam" ar-raycaster raycaster="objects:none;"></a-camera>
    
    <!-- Surface Detection Ring (Reticle) -->
    <a-ring id="circle" 
            rotation="-90 0 0" 
            radius-inner="0.08" 
            radius-outer="0.12" 
            color="#00ffe7" 
            visible="false">
    </a-ring>

    <!-- The 3D Mannequin Model -->
    <a-entity id="mannequin" 
              gltf-model="./vastraverse_mannequin.glb" 
              scale="10 10 10" 
              position="0 0 -5" 
              visible="false">
              
      <!-- Attached Light for Thermal Effects -->
      <a-light id="thermal-light" type="point" intensity="0" position="0 1.5 0"></a-light>
    </a-entity>

    <!-- General Lighting -->
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>

  </a-scene>

</body>
</html>
