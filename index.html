<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VastraVerse SmartWeave XR</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- Local aframe-ar (markerless build) -->
<script src="./aframe-ar-main/dist/aframe-ar.min.js"></script>
<style>
body { margin:0; font-family: Arial; overflow:hidden; background:#050810; color:white; }
#uiPanel{
  position:fixed;
  top:20px;
  left:20px;
  background:rgba(0,0,0,0.6);
  padding:20px;
  border:1px solid #00ffe7;
  z-index:10;
}
button{
  margin:5px 0;
  padding:6px 12px;
  cursor:pointer;
}
#temp{
  width:100%;
}
</style>
</head>

<body>

<!-- UI PANEL -->
<div id="uiPanel">
  <h3>SmartWeave Control</h3>

  <strong>Fabric:</strong><br>
  <button onclick="selectFabric('#c06030')">Kanchipuram Silk</button><br>
  <button onclick="selectFabric('#2050c0')">Cool Banarasi</button><br>
  <button onclick="selectFabric('#50b050')">Organic Khadi</button><br>
  <button onclick="selectFabric('#c030c0')">Smart Chanderi</button><br><br>

  <strong>Temperature:</strong><br>
  <input type="range" id="temp" min="15" max="50" value="30"
         oninput="updateTemp(this.value)">
  <div id="tempValue">30°C</div><br>

  <button onclick="toggleRotate()">Toggle Rotate</button>
</div>

<!-- A-FRAME MARKERLESS AR SCENE -->
<a-scene
  vr-mode-ui="enabled: true"
  renderer="logarithmicDepthBuffer: true;"
  ar="sourceType: webcam; debugUIEnabled: false;"
>

  <!-- Camera -->
  <a-camera id="camera"
            ar-raycaster
            raycaster="objects: .clickable">
  </a-camera>

  <!-- Light -->
  <a-entity light="type:ambient; intensity:0.7"></a-entity>
  <a-entity light="type:directional; intensity:0.8" position="1 2 1"></a-entity>

  <!-- Placement Circle -->
  <a-ring id="circle"
          rotation="-90 0 0"
          radius-inner="0.03"
          radius-outer="0.05"
          color="#00ffe7">
  </a-ring>

  <!-- GLB MODEL -->
  <a-gltf-model id="mannequin"
                src="./vastraverse_mannequin.glb"
                scale="0.5 0.5 0.5"
                position="0 0 -2">
  </a-gltf-model>

</a-scene>

<script>

// STATE
let currentColor = "#c06030";
let rotating = false;

// PLACE MODEL ON TOUCH
window.addEventListener('click', function(){
  let cam = document.querySelector("#camera");
  let model = document.querySelector("#mannequin");

  let direction = new THREE.Vector3();
  cam.object3D.getWorldDirection(direction);

  let position = cam.object3D.position.clone().add(direction.multiplyScalar(2));

  model.setAttribute('position', position);
});

// FABRIC CHANGE
function selectFabric(color){
  currentColor = color;

  const model = document.querySelector('#mannequin');

  model.addEventListener('model-loaded', () => {
    const mesh = model.getObject3D('mesh');
    mesh.traverse(node => {
      if(node.isMesh){
        node.material.color.set(color);
      }
    });
  });
}

// TEMPERATURE REACTION
function updateTemp(val){
  document.getElementById("tempValue").innerText = val + "°C";

  const model = document.querySelector('#mannequin');
  const mesh = model.getObject3D('mesh');
  if(!mesh) return;

  mesh.traverse(node => {
    if(node.isMesh){
      if(val > 30){
        node.material.emissive.set('#00ccff'); // Cooling glow
      }
      else if(val < 20){
        node.material.emissive.set('#ff5500'); // Heating glow
      }
      else{
        node.material.emissive.set('#000000'); // Neutral
      }
    }
  });
}

// ROTATION
function toggleRotate(){
  rotating = !rotating;
}

AFRAME.registerComponent('auto-rotate',{
  tick:function(){
    if(rotating){
      this.el.object3D.rotation.y += 0.01;
    }
  }
});

document.querySelector("#mannequin")
        .setAttribute("auto-rotate","");

</script>

</body>
