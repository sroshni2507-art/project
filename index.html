<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VastraVerse · XR Hybrid</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Environment for VR -->
  <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&family=Space+Mono&display=swap');

    :root {
      --gold: #c9a84c;
      --cyan: #00ffe7;
      --magenta: #ff2d78;
      --panel-bg: rgba(5, 8, 16, 0.9);
      --border: rgba(201, 168, 76, 0.4);
    }

    body { margin: 0; overflow: hidden; font-family: 'Rajdhani', sans-serif; background: #000; }

    /* ── UI OVERLAY ── */
    #vastra-interface {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
      display: grid;
      grid-template-columns: 280px 1fr 240px;
      grid-template-rows: 70px 1fr 100px;
    }
    #vastra-interface > * { pointer-events: all; }

    .header {
      grid-column: 1 / -1; background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 30px; display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    .left-panel, .right-panel { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .panel-card { background: var(--panel-bg); border: 1px solid var(--border); padding: 15px; border-top: 3px solid var(--gold); }

    .logo { font-family: 'Orbitron'; color: var(--gold); letter-spacing: 4px; font-size: 18px; }
    .label { font-family: 'Space Mono'; font-size: 8px; color: var(--gold); margin-bottom: 5px; display: block; }
    .temp-val { font-family: 'Orbitron'; font-size: 42px; font-weight: 900; color: #fff; }

    .fabric-btn {
      padding: 10px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.02); color: #fff; cursor: pointer;
      display: flex; align-items: center; gap: 10px; transition: 0.3s;
    }
    .fabric-btn.active { border-color: var(--cyan); background: rgba(0, 255, 231, 0.1); }
    .dot { width: 10px; height: 10px; border-radius: 50%; }

    input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; }

    .bottom-bar {
      grid-column: 1 / -1; background: var(--panel-bg); border-top: 1px solid var(--border);
      display: flex; justify-content: center; align-items: center; gap: 40px;
    }

    .xr-mode-btn {
      background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
      padding: 10px 25px; font-family: 'Orbitron'; font-size: 10px; cursor: pointer;
    }
    .xr-mode-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

    #notif {
      position: fixed; top: 85px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 255, 231, 0.2); border: 1px solid var(--cyan);
      color: var(--cyan); padding: 8px 20px; font-family: 'Space Mono'; display: none;
    }
  </style>
</head>
<body>

  <!-- UI DASHBOARD -->
  <div id="vastra-interface">
    <header class="header">
      <div class="logo">VASTRA<span>VERSE</span> XR</div>
      <div id="status-tag" style="color: var(--cyan); font-family: 'Space Mono'; font-size: 10px;">SYSTEM ONLINE</div>
    </header>

    <aside class="left-panel">
      <div class="panel-card" style="border-top-color: var(--cyan);">
        <span class="label">NANO-THERMAL SENSOR</span>
        <div class="temp-val" id="temp-display">44<sup>°C</sup></div>
        <input type="range" id="temp-slider" min="15" max="50" value="44">
        <div id="mode-text" style="color: var(--cyan); margin-top: 10px; font-size: 12px; font-family: 'Space Mono';">COOLING ACTIVE</div>
      </div>

      <div class="panel-card">
        <span class="label">SMART FABRICS</span>
        <div class="fabric-btn active" onclick="updateSuit('#c06030', 'Silk')"><div class="dot" style="background:#c06030"></div>Kanchipuram Silk</div>
        <div class="fabric-btn" onclick="updateSuit('#2050c0', 'Banarasi')"><div class="dot" style="background:#2050c0"></div>Cool Banarasi</div>
        <div class="fabric-btn" onclick="updateSuit('#50b050', 'Khadi')"><div class="dot" style="background:#50b050"></div>Organic Khadi</div>
      </div>
    </aside>

    <section></section>

    <aside class="right-panel">
      <div class="panel-card">
        <span class="label">FIBER STATUS</span>
        <div style="font-size: 12px; line-height: 1.8;">
          ⚡ Power: 98%<br>
          🌿 Eco: <span id="eco-type">Organic Silk</span><br>
          📶 Link: Active
        </div>
      </div>
    </aside>

    <footer class="bottom-bar">
      <button class="xr-mode-btn" onclick="toggleRotation()">TOGGLE ROTATION</button>
      <div style="color: var(--gold); font-size: 10px; font-family: 'Space Mono';">AR: POINT CAMERA & TAP TO PLACE</div>
    </footer>
  </div>

  <div id="notif">FABRIC UPDATED</div>

  <!-- A-FRAME SCENE -->
  <!-- 'ar' and 'vr' are handled by WebXR automatically -->
  <a-scene 
    webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #vastra-interface;"
    renderer="antialias: true; alpha: true; colorManagement: true;">
    
    <a-assets>
      <!-- REPLACEMENT MODEL URL (Wait for it to load) -->
      <a-asset-item id="suitModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/SheenChair/glTF-Binary/SheenChair.glb"></a-asset-item>
      <!-- Note: Swap above 'src' to "./vastraverse_mannequin.glb" when your file is ready -->
    </a-assets>

    <!-- VR Background (Hidden in AR) -->
    <a-entity id="vr-env" environment="preset: contact; grid: 1; gridColor: #c9a84c; background: #050810;"></a-entity>

    <!-- Camera Setup -->
    <a-entity id="rig">
      <a-camera id="cam" position="0 1.6 0"></a-camera>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- AR Placement Indicator -->
    <a-ring id="reticle" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.15" color="#00ffe7"></a-ring>

    <!-- THE 3D MODEL -->
    <a-entity id="suit" 
              gltf-model="#suitModel" 
              position="0 0.5 -2.5" 
              scale="2 2 2"
              visible="true">
      <a-light id="suitGlow" type="point" intensity="0" position="0 1 0"></a-light>
    </a-entity>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="1 3 2" intensity="1"></a-light>

  </a-scene>

  <script>
    const suit = document.querySelector('#suit');
    const reticle = document.querySelector('#reticle');
    const glow = document.querySelector('#suitGlow');
    let rotating = true;

    // --- AR LOGIC: Reticle Follows Gaze ---
    document.querySelector('a-scene').addEventListener('tick', () => {
      const cam = document.querySelector('#cam');
      let pos = cam.object3D.position;
      let dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(cam.object3D.quaternion);
      reticle.object3D.position.set(pos.x + dir.x*2, 0.01, pos.z + dir.z*2);
    });

    // Place Model on Click
    window.addEventListener('click', () => {
      const pos = reticle.getAttribute('position');
      suit.setAttribute('position', pos);
      notify("OBJECT POSITIONED");
    });

    // --- UI INTERACTION ---
    function updateSuit(color, name) {
      const mesh = suit.getObject3D('mesh');
      if (mesh) {
        mesh.traverse(node => {
          if (node.isMesh) {
            node.material.color.set(color);
            node.material.emissive.set(color);
            node.material.emissiveIntensity = 0.2;
          }
        });
      }
      document.getElementById('eco-type').innerText = name;
      notify(name.toUpperCase() + " APPLIED");
    }

    // Thermal Slider
    document.querySelector('#temp-slider').addEventListener('input', (e) => {
      const val = e.target.value;
      document.getElementById('temp-display').innerHTML = `${val}<sup>°C</sup>`;
      const mode = document.getElementById('mode-text');
      
      if(val > 30) {
        mode.innerText = "COOLING ACTIVE"; mode.style.color = "var(--cyan)";
        glow.setAttribute('light', {intensity: (val-30)/5, color: '#00ffe7'});
      } else if (val < 22) {
        mode.innerText = "HEATING ACTIVE"; mode.style.color = "var(--magenta)";
        glow.setAttribute('light', {intensity: (22-val)/5, color: '#ff2d78'});
      } else {
        mode.innerText = "STABLE"; mode.style.color = "var(--gold)";
        glow.setAttribute('light', 'intensity', 0);
      }
    });

    function toggleRotation() { 
      rotating = !rotating; 
      notify(rotating ? "ROTATION ON" : "ROTATION OFF");
    }

    // Smooth Rotation Tick
    setInterval(() => {
      if(rotating) {
        let rot = suit.getAttribute('rotation');
        rot.y += 0.8;
        suit.setAttribute('rotation', rot);
      }
    }, 16);

    function notify(msg) {
      const n = document.getElementById('notif');
      n.innerText = msg; n.style.display = 'block';
      setTimeout(() => n.style.display = 'none', 2000);
    }
  </script>
</body>
</html>
